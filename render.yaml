# Creates billable production resources when deployed. Review Render's estimate first.
services:
  - type: web
    name: snl-registry
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    domains:
      - scoutnationallibanais.org
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: APP_ORIGIN
        value: https://scoutnationallibanais.org
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: '5'
