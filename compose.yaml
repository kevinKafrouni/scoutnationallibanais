services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: snl
      POSTGRES_USER: snl
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snl -d snl"]
      interval: 5s
      retries: 10
volumes:
  registry-data:
